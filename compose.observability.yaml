x-tracing: &tracing
  OTEL_EXPORTER_OTLP_ENDPOINT: http://telemetry:4318

services:
  gateway:
    environment: *tracing
  catalog:
    environment: *tracing
  repositories:
    environment: *tracing
  security:
    environment: *tracing
  workspace:
    environment: *tracing
  worker:
    environment: *tracing
  dispatcher:
    environment: *tracing
  catalog-importer:
    environment: *tracing
  repositories-importer:
    environment: *tracing
  security-importer:
    environment: *tracing
  telemetry:
    profiles: [observability]
    image: grafana/otel-lgtm:0.11.11@sha256:f9f6310025dc4e1ae1bd4f44dc24ffcbaa354c3daccdc1edf8d0d96d2bd972d2
    networks: [backend, edge]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
    ports: ["127.0.0.1:${GRAFANA_PORT:-3001}:3000"]
    volumes:
      - telemetry-data:/data
      - ./infra/telemetry/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - ./infra/telemetry/alerts.yaml:/otel-lgtm/radar-alerts.yaml:ro
      - ./infra/telemetry/provider.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/radar.yaml:ro
      - ./infra/telemetry/dashboard.json:/otel-lgtm/radar-dashboard.json:ro
volumes:
  telemetry-data:
