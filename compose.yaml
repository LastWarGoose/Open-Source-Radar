name: open-source-radar

x-python: &python
  build:
    context: .
    dockerfile: infra/python.Dockerfile
    target: runtime
  init: true
  networks: [backend]

x-catalog-env: &catalog-env
  SERVICE_NAME: catalog
  DB_HOST: postgres
  DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Run scripts/bootstrap.py}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Run scripts/bootstrap.py}

x-migration-env: &migration-env
  DB_HOST: postgres
  CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Run scripts/bootstrap.py}
  REPOSITORIES_DB_PASSWORD: ${REPOSITORIES_DB_PASSWORD:?Run scripts/bootstrap.py}
  SECURITY_DB_PASSWORD: ${SECURITY_DB_PASSWORD:?Run scripts/bootstrap.py}
  WORKSPACE_DB_PASSWORD: ${WORKSPACE_DB_PASSWORD:?Run scripts/bootstrap.py}

x-api-health: &api-health
  test:
    [
      "CMD",
      ".venv/bin/python",
      "-c",
      "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4)",
    ]
  interval: 10s
  timeout: 5s
  retries: 15

services:
  postgres:
    image: postgres:18.7-bookworm
    environment:
      <<: *migration-env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/bootstrap.py}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/01-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
  rabbitmq:
    image: rabbitmq:4.4.0-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: radar
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run scripts/bootstrap.py}
      RABBITMQ_DEFAULT_VHOST: radar
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4.12-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    volumes: ["redis-data:/data"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 15
  migrate:
    <<: *python
    command: [".venv/bin/python", "-m", "scripts.migrate"]
    environment: *migration-env
    depends_on:
      postgres: { condition: service_healthy }
  catalog:
    <<: *python
    environment:
      <<: *catalog-env
      DEV_ADMIN_TOKEN: ${DEV_ADMIN_TOKEN:?Run scripts/bootstrap.py}
      SITE_URL: ${SITE_URL:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck: *api-health
  repositories:
    <<: *python
    command:
      [".venv/bin/uvicorn", "services.repositories.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      SERVICE_NAME: repositories
      DB_HOST: postgres
      DB_PASSWORD: ${REPOSITORIES_DB_PASSWORD:?Run scripts/bootstrap.py}
      DEV_ADMIN_TOKEN: ${DEV_ADMIN_TOKEN:?Run scripts/bootstrap.py}
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck: *api-health
  security:
    <<: *python
    command:
      [".venv/bin/uvicorn", "services.security.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      SERVICE_NAME: security
      DB_HOST: postgres
      DB_PASSWORD: ${SECURITY_DB_PASSWORD:?Run scripts/bootstrap.py}
      DEV_ADMIN_TOKEN: ${DEV_ADMIN_TOKEN:?Run scripts/bootstrap.py}
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck: *api-health
  workspace:
    <<: *python
    command:
      [".venv/bin/uvicorn", "services.workspace.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      SERVICE_NAME: workspace
      DB_HOST: postgres
      DB_PASSWORD: ${WORKSPACE_DB_PASSWORD:?Run scripts/bootstrap.py}
      DEV_ADMIN_TOKEN: ${DEV_ADMIN_TOKEN:?Run scripts/bootstrap.py}
      SITE_URL: ${SITE_URL:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck: *api-health
  worker:
    <<: *python
    command:
      [
        ".venv/bin/celery",
        "-A",
        "services.catalog.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=2",
        "--queues=catalog.probes",
        "--hostname=catalog@%h",
      ]
    environment: *catalog-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD-SHELL",
          ".venv/bin/celery -A services.catalog.celery_app:celery_app inspect ping -d catalog@$$HOSTNAME --timeout=3",
        ]
      interval: 15s
      timeout: 6s
      retries: 20
  catalog-importer:
    <<: *python
    networks: [backend, sources]
    command:
      [
        ".venv/bin/celery",
        "-A",
        "services.catalog.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=1",
        "--queues=catalog.imports",
        "--hostname=catalog-import@%h",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          ".venv/bin/celery -A services.catalog.celery_app:celery_app inspect ping -d catalog-import@$$HOSTNAME --timeout=3",
        ]
      interval: 15s
      timeout: 6s
      retries: 20
    environment:
      <<: *catalog-env
      DEV_ADMIN_TOKEN: ${DEV_ADMIN_TOKEN:?Run scripts/bootstrap.py}
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
  repositories-importer:
    <<: *python
    networks: [backend, sources]
    command:
      [
        ".venv/bin/celery",
        "-A",
        "services.catalog.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=1",
        "--queues=repositories.imports",
        "--hostname=repositories-import@%h",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          ".venv/bin/celery -A services.catalog.celery_app:celery_app inspect ping -d repositories-import@$$HOSTNAME --timeout=3",
        ]
      interval: 15s
      timeout: 6s
      retries: 20
    environment:
      SERVICE_NAME: repositories
      DB_HOST: postgres
      DB_PASSWORD: ${REPOSITORIES_DB_PASSWORD:?Run scripts/bootstrap.py}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Run scripts/bootstrap.py}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      DEV_ADMIN_TOKEN: ${DEV_ADMIN_TOKEN:?Run scripts/bootstrap.py}
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
  security-importer:
    <<: *python
    networks: [backend, sources]
    command:
      [
        ".venv/bin/celery",
        "-A",
        "services.catalog.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=1",
        "--queues=security.imports",
        "--hostname=security-import@%h",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          ".venv/bin/celery -A services.catalog.celery_app:celery_app inspect ping -d security-import@$$HOSTNAME --timeout=3",
        ]
      interval: 15s
      timeout: 6s
      retries: 20
    environment:
      SERVICE_NAME: security
      DB_HOST: postgres
      DB_PASSWORD: ${SECURITY_DB_PASSWORD:?Run scripts/bootstrap.py}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Run scripts/bootstrap.py}
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
  beat:
    <<: *python
    command: [".venv/bin/python", "-m", "services.beat"]
    environment: *catalog-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          ".venv/bin/python",
          "-c",
          "import time,pathlib; assert time.time()-float(pathlib.Path('/tmp/radar-beat-heartbeat').read_text())<20",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
  dispatcher:
    <<: *python
    command: [".venv/bin/python", "-m", "services.catalog.dispatcher"]
    environment: *catalog-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          ".venv/bin/python",
          "-c",
          "import time,pathlib; assert time.time()-float(pathlib.Path('/tmp/radar-dispatcher-heartbeat').read_text())<20",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
  gateway:
    build:
      context: .
      dockerfile: infra/node.Dockerfile
    init: true
    command: ["pnpm", "--filter", "@radar/gateway", "start"]
    environment:
      SITE_URL: ${SITE_URL:-}
    networks: [edge, backend]
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      catalog: { condition: service_healthy }
      repositories: { condition: service_healthy }
      security: { condition: service_healthy }
      workspace: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/graphql',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:'query Ready { __typename }'})}).then(async r=>{const b=await r.json();process.exit(r.ok&&!b.errors?0:1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 30
  web:
    build:
      context: .
      dockerfile: infra/node.Dockerfile
    init: true
    command: ["pnpm", "--filter", "@radar/web", "dev"]
    networks: [edge]
    environment:
      GRAPHQL_URL: http://gateway:4000/graphql
      NEXT_PUBLIC_GRAPHQL_URL: http://localhost:4000/graphql
      NEXT_PUBLIC_GRAPHQL_WS_URL: ws://localhost:4000/graphql
      SITE_URL: ${SITE_URL:-}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      gateway: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 8s
      retries: 30
  checks:
    build:
      context: .
      dockerfile: infra/python.Dockerfile
      target: checks
    profiles: [test]
    networks: [backend]
    environment:
      <<: [*migration-env, *catalog-env]
      DEV_ADMIN_TOKEN: ${DEV_ADMIN_TOKEN:?Run scripts/bootstrap.py}
      GRAPHQL_URL: http://gateway:4000/graphql
    command: [".venv/bin/python", "-m", "scripts.check_stage1"]

networks:
  edge:
  sources:
  backend:
    internal: true
volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
