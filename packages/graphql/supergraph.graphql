scalar join__DirectiveArguments

scalar join__FieldSet

enum join__Graph {
  CATALOG @join__graph(name: "catalog", url: "http://catalog:8000/graphql")
  REPOSITORIES @join__graph(name: "repositories", url: "http://repositories:8000/graphql")
  SECURITY @join__graph(name: "security", url: "http://security:8000/graphql")
  WORKSPACE @join__graph(name: "workspace", url: "http://workspace:8000/graphql")
}

scalar link__Import

enum link__Purpose {
  """
  `SECURITY` features provide metadata necessary to securely resolve fields.
  """
  SECURITY

  """
  `EXECUTION` features provide metadata necessary for operation execution.
  """
  EXECUTION
}

type Mutation
  @join__type(graph: CATALOG)
  @join__type(graph: REPOSITORIES)
  @join__type(graph: SECURITY)
  @join__type(graph: WORKSPACE)
{
  requestCampaign(requestKey: UUID!, names: [String!]!, target: Int! = 10000): ImportCampaign! @join__field(graph: CATALOG)
  updateRepositoryProjection(snapshot: RepositoryProjectionInput!): Boolean! @join__field(graph: CATALOG)
  requestProbeJob(requestKey: UUID!): ProbeJob! @join__field(graph: CATALOG)
  requestImport(requestKey: UUID!, targets: [ImportTarget!]!): ImportJob! @join__field(graph: CATALOG)
  resumeImport(id: UUID!): ImportJob! @join__field(graph: CATALOG)
  advanceDemo(id: ID!): DemoPackage! @join__field(graph: CATALOG)
  requestRepositoryImport(requestKey: UUID!, packageId: ID!, urls: [String!]!, observedAt: DateTime!, maxRepositories: Int! = 5): SourceImportJob! @join__field(graph: REPOSITORIES)
  requestSecurityImport(requestKey: UUID!, releaseId: ID!, name: String!, version: String!, observedAt: DateTime!): SourceImportJob! @join__field(graph: SECURITY)
  register(username: String!, password: String!): Registration! @join__field(graph: WORKSPACE)
  login(username: String!, password: String!): Account! @join__field(graph: WORKSPACE)
  logout: Boolean! @join__field(graph: WORKSPACE)
  recoverAccount(username: String!, recoveryCode: String!, password: String!): String! @join__field(graph: WORKSPACE)
  createCollection(name: String!): Collection! @join__field(graph: WORKSPACE)
  deleteCollection(id: ID!): Boolean! @join__field(graph: WORKSPACE)
  addPackageToCollection(id: ID!, packageId: ID!): Collection! @join__field(graph: WORKSPACE)
  removePackageFromCollection(id: ID!, packageId: ID!): Collection! @join__field(graph: WORKSPACE)
  followPackage(packageId: ID!): Boolean! @join__field(graph: WORKSPACE)
  unfollowPackage(packageId: ID!): Boolean! @join__field(graph: WORKSPACE)
  markNotificationRead(id: ID!): Boolean! @join__field(graph: WORKSPACE)
  recordPackageUpdate(packageId: ID!, version: String!, observedAt: DateTime!): Boolean! @join__field(graph: WORKSPACE)
}

