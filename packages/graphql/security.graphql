schema @link(url: "https://specs.apollo.dev/federation/v2.7", import: ["@external", "@key", "@shareable"]) {
  query: Query
  mutation: Mutation
}

type AdvisoryAlias {
  name: String!
}

type AdvisoryAliasConnection {
  nodes: [AdvisoryAlias!]!
  pageInfo: PageInfo!
}

type AdvisoryFix {
  advisoryId: ID!
  version: String!
  historical: Boolean!
}

type AdvisoryFixConnection {
  nodes: [AdvisoryFix!]!
  pageInfo: PageInfo!
}

"""Date with time (isoformat)"""
scalar DateTime

type Mutation {
  requestSecurityImport(requestKey: UUID!, releaseId: ID!, name: String!, version: String!, observedAt: DateTime!): SourceImportJob!
}

extend type Package @key(fields: "id") {
  id: ID! @external
  nearestOsvScan(version: String!): VersionScan
}

type PageInfo @shareable {
  hasNextPage: Boolean!
  endCursor: String
}

type Query {
  _entities(representations: [_Any!]!): [_Entity]!
  _service: _Service!
  securityImportJob(id: UUID!): SourceImportJob
  vulnerability(id: ID!): Vulnerability
}

extend type Release @key(fields: "id") {
  id: ID! @external
  scan: VersionScan
}

enum ScanStatus {
  UNKNOWN
  SUCCESS
  STALE
  FAILED
}

type SourceImportJob @shareable {
  id: UUID!
  status: String!
  attempts: Int!
  errorCode: String
  nextAttemptAt: DateTime!
}

scalar UUID

type VersionScan {
  id: ID!
  status: ScanStatus!
  source: String!
  checkedAt: DateTime
  lastSuccessAt: DateTime
  errorCode: String
  version: String
  fixes(first: Int! = 20, after: String = null): AdvisoryFixConnection!
  findings(first: Int! = 20, after: String = null): VulnerabilityConnection!
}

type Vulnerability @key(fields: "id") {
  id: ID!
  summary: String!
  source: String!
  fetchedAt: DateTime!
  aliases(first: Int! = 20, after: String = null): AdvisoryAliasConnection!
}

type VulnerabilityConnection {
  nodes: [Vulnerability!]!
  pageInfo: PageInfo!
}

scalar _Any

union _Entity = Package | Release | Vulnerability

type _Service {
  sdl: String!
}
