# Use only with a separate project name and restored test volumes.
services:
  gateway:
    ports: !override ["127.0.0.1:4400:4000"]
    environment: { SITE_URL: "http://localhost:3300" }
  web:
    ports: !override ["127.0.0.1:3300:3000"]
    environment:
      NEXT_PUBLIC_GRAPHQL_URL: http://localhost:4400/graphql
      NEXT_PUBLIC_GRAPHQL_WS_URL: ws://localhost:4400/graphql
      SITE_URL: http://localhost:3300
  workspace:
    environment: { SITE_URL: "http://localhost:3300" }
  catalog:
    environment: { SITE_URL: "http://localhost:3300" }
  telemetry:
    ports: !override ["127.0.0.1:3301:3000"]
networks:
  sources:
    internal: true
