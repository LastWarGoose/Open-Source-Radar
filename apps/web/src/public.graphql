query CatalogLicenses($after: String) {
  catalogLicenses(first: 100, after: $after) {
    nodes
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
fragment FreshnessFields on SourceFreshness {
  status
  checkedAt
  lastSuccessAt
  errorCode
}
fragment CatalogItem on Package {
  id
  name
  summary
  license
  requiresPython
  pypiFreshness {
    errorCode
  }
  starProjection {
    stars
    status
  }
  releases(first: 1, source: "PYPI") {
    nodes {
      version
    }
  }
}
fragment RepositoryDetails on RepositoryLink {
  status
  repository {
    id
    fullName
    description
    url
    stars
  }
}
fragment Overview on Package {
  id
  name
  source
  summary
  license
  requiresPython
  pypiFreshness {
    ...FreshnessFields
  }
  starProjection {
    stars
    status
    checkedAt
    projectedAt
    lagSeconds
  }
  githubFreshness {
    ...FreshnessFields
  }
  repositories(first: 5) {
    nodes {
      ...RepositoryDetails
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
fragment ScanSummary on VersionScan {
  version
  status
  checkedAt
  lastSuccessAt
  errorCode
  source
  fixes(first: 100) {
    nodes {
      advisoryId
      version
      historical
    }
    pageInfo {
      hasNextPage
    }
  }
  findings(first: 100) {
    nodes {
      id
    }
    pageInfo {
      hasNextPage
    }
  }
}
fragment ScanFields on VersionScan {
  ...ScanSummary
  findings(first: 100) {
    nodes {
      id
      summary
      source
      aliases(first: 100) {
        nodes {
          name
        }
      }
    }
    pageInfo {
      hasNextPage
    }
  }
}
query NearestOsvScan($id: ID!, $version: String!) {
  package(id: $id) {
    nearestOsvScan(version: $version) {
      ...ScanFields
    }
  }
}
query NearestPypiRelease($id: ID!, $version: String!, $dependencyAfter: String) {
  package(id: $id) {
    nearestPypiRelease(version: $version) {
      ...ReleaseInspection
    }
  }
}
fragment ReleaseInspection on Release {
  id
  version
  yanked
  fetchedAt
  dependencies(first: 20, after: $dependencyAfter) {
    nodes {
      id
      raw
      name
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
  scan {
    ...ScanFields
  }
}
query PublicCatalog(
  $first: Int!
  $after: String
  $search: String
  $filter: PackageFilter
  $sort: PackageSort!
) {
  catalogLicenseRevision
  packages(first: $first, after: $after, search: $search, filter: $filter, sort: $sort) {
    nodes {
      ...CatalogItem
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
query PackageMetadata($id: ID!) {
  package(id: $id) {
    name
    summary
    source
  }
}
query PublicPackage(
  $id: ID!
  $version: String!
  $hasVersion: Boolean!
  $releaseAfter: String
  $dependencyAfter: String
) {
  package(id: $id) {
    ...Overview
    versions: releases(first: 20, after: $releaseAfter, source: "PYPI") {
      nodes {
        id
        version
        yanked
        isPrerelease
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
    latest: releases(first: 1, source: "PYPI") @skip(if: $hasVersion) {
      nodes {
        ...ReleaseInspection
      }
    }
    selected: release(version: $version, source: "PYPI") @include(if: $hasVersion) {
      ...ReleaseInspection
    }
  }
}
fragment CompareItem on Package {
  id
  source
  summary
  requiresPython
  license
  githubFreshness {
    status
  }
  pypiFreshness {
    ...FreshnessFields
  }
  starProjection {
    stars
    status
    checkedAt
    projectedAt
    lagSeconds
  }
  repositories(first: 5) {
    nodes {
      ...RepositoryDetails
    }
    pageInfo {
      hasNextPage
    }
  }
  current: releases(first: 1, source: "PYPI") {
    nodes {
      id
      version
      fetchedAt
      scan {
        ...ScanSummary
      }
    }
  }
}
query ComparePackages(
  $a: ID!
  $b: ID!
  $c: ID!
  $d: ID!
  $hasB: Boolean!
  $hasC: Boolean!
  $hasD: Boolean!
) {
  a: package(id: $a) {
    ...CompareItem
  }
  b: package(id: $b) @include(if: $hasB) {
    ...CompareItem
  }
  c: package(id: $c) @include(if: $hasC) {
    ...CompareItem
  }
  d: package(id: $d) @include(if: $hasD) {
    ...CompareItem
  }
}
