query WorkspaceGraph {
  myCollections(first: 1) {
    nodes {
      id
      items(first: 2) {
        nodes {
          package {
            id
            name
            repositories(first: 2) {
              nodes {
                status
                repository {
                  id
                  fullName
                  source
                }
              }
            }
            releases(first: 8) {
              nodes {
                id
                version
                isPrerelease
                yanked
                dependencies(first: 2) {
                  nodes {
                    raw
                    extras
                    marker
                    package {
                      name
                    }
                  }
                }
                scan {
                  status
                  source
                  checkedAt
                  findings(first: 2) {
                    nodes {
                      id
                      aliases(first: 2) {
                        nodes {
                          name
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  myNotifications(first: 1) {
    nodes {
      message
      package {
        name
      }
    }
  }
}
